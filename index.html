<!DOCTYPE html>
<html lang="en">
<head>
    <title>Java & HTML Connection</title>
</head>
<body>
    <h1 id="output">test test.</h1>

    <script>
        const { exec } = require('child_process');

// 1. Compile the Java file (if not already compiled)
exec('ApartmentManagementSystem.java', (compileError, stdout, stderr) => {
    if (compileError) {
        console.error(`Compilation Error: ${compileError.message}`);
        return;
    }

    // 2. Run the compiled Java class
    exec('java MyProgram', (runError, stdout, stderr) => {
        if (runError) {
            console.error(`Runtime Error: ${runError.message}`);
            return;
        }
        
        console.log(`Java Output:\n${stdout}`);
    });
});
    </script>
</body>
</html>
